<!DOCTYPE html>
<html lang="en" class="preview-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="bb-frontend" content="portal" />
  <meta name="bb-asset-version" content="{{ASSET_VERSION}}" />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Preview - Object storage</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/dialogs.css" />
  <link rel="stylesheet" href="assets/css/viewers.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
  <link rel="stylesheet" href="assets/css/preview.css" />
</head>
<body class="preview-page">
  <a class="skipLink" href="#viewer">Skip to the preview</a>

  <header class="bar previewBar">
    <div class="previewBar__inner bb-menu-constrain">
      <a class="backLink previewBar__back" id="backBtn" title="Back to the folder"><i class="ic ic-chevron-left" aria-hidden="true"></i><span>Folder</span></a>
      <div class="preview-title-group previewTitle">
        <div class="previewTitle__line">
          <h1 class="doc-name" id="docName">Loading</h1>
          <span class="doc-size" id="docSize"></span>
        </div>
        <div class="preview-context previewTitle__path">
          <i class="ic ic-database" aria-hidden="true"></i>
          <span id="instanceMeta"></span><span class="doc-prefix" id="docPrefix"></span>
        </div>
      </div>
      <div class="previewBar__tools">
        <span class="buildTag" id="previewBuild" hidden><span></span></span>
        <div class="compareFrom" id="compareFrom" hidden></div>
        <div class="compareStats" id="compareStats" hidden></div>
        <div class="previewVersion bb-details-version-control" id="previewVersionControl" hidden></div>
        <button type="button" class="iconButton compareClose" id="compareClose" title="Close the comparison" aria-label="Close the comparison" hidden><i class="ic ic-x" aria-hidden="true"></i></button>
        <a class="button button--icon" id="openRawBtn" title="Open the original" aria-label="Open the original" target="_blank" rel="noopener"><i class="ic ic-external-link" aria-hidden="true"></i></a>
        <div class="bb-menu" id="previewMenu">
          <button type="button" class="bb-kebab button button--icon" id="previewKebabBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Actions" title="Actions"><i class="ic ic-dots-vertical" aria-hidden="true"></i></button>
          <div class="bb-menu-popover" role="menu">
            <div class="bb-menu-list">
              <button type="button" class="bb-menu-item" role="menuitem" id="pv-download"><i class="mdi mdi-download" aria-hidden="true"></i>Download</button>
              <button type="button" class="bb-menu-item" role="menuitem" id="pv-copy"><i class="mdi mdi-content-copy" aria-hidden="true"></i>Copy</button>
              <button type="button" class="bb-menu-item" role="menuitem" id="pv-rename"><i class="mdi mdi-rename-outline" aria-hidden="true"></i>Rename</button>
              <button type="button" class="bb-menu-item" role="menuitem" id="pv-details"><i class="mdi mdi-information-outline" aria-hidden="true"></i>Details</button>
              <button type="button" class="bb-menu-item danger" role="menuitem" id="pv-delete"><i class="mdi mdi-delete-outline" aria-hidden="true"></i>Delete</button>
            </div>
          </div>
        </div>
        <div class="themeSelect" data-theme-select>
          <button type="button" class="button button--icon themeSelect__button" data-theme-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme: system" title="Theme">
            <span class="themeSelect__current" aria-hidden="true"><i class="ic ic-device-desktop themeIcon themeIcon--system"></i><i class="ic ic-moon themeIcon themeIcon--dark"></i><i class="ic ic-sun themeIcon themeIcon--light"></i></span>
          </button>
          <div id="themeMenu" class="themeSelect__menu" role="listbox" aria-label="Theme" hidden>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="system" aria-selected="true" aria-label="System theme" title="System"><i class="ic ic-device-desktop" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="dark" aria-selected="false" aria-label="Dark theme" title="Dark"><i class="ic ic-moon" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="light" aria-selected="false" aria-label="Light theme" title="Light"><i class="ic ic-sun" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="viewer">
    <div class="bb-menu-constrain">
      <div id="viewer" class="markdown-body preview-loading" tabindex="-1">
        <i class="mdi mdi-loading mdi-spin" aria-hidden="true"></i>
        <span>Loading the preview</span>
      </div>
    </div>
  </main>

  <script src="assets/js/session.js"></script>
  <script src="assets/vendor/highlightjs/11/highlight.min.js"></script>
  <script src="assets/vendor/marked/12.0.2/marked.min.js"></script>
  <script src="assets/js/common/detect.js"></script>
  <script src="assets/js/common/runtime.js"></script>
  <script src="assets/js/common/api.js"></script>
  <script src="assets/js/common/ui.js"></script>
  <script src="assets/js/common/download-manager.js"></script>
  <script src="assets/js/common/actions.js"></script>
  <script src="assets/js/common/menu.js"></script>
  <script src="assets/js/tags.js"></script>
  <script src="assets/js/metadata.js"></script>
  <script src="assets/js/diff.js"></script>
  <script src="assets/js/versions.js"></script>
  <script src="assets/js/common/render.js"></script>
  <script src="assets/js/common/json-viewer.js"></script>
  <script src="assets/js/common/tabular.js"></script>
  <script src="assets/js/common/sqlite-viewer.js"></script>
  <script src="assets/js/common/structured-viewers.js"></script>
  <script src="assets/js/preview.js"></script>
</body>
</html>
