<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="bb-frontend" content="portal" />
  <meta name="bb-asset-version" content="{{ASSET_VERSION}}" />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Object storage</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/dialogs.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body>
  <a class="skipLink" href="#main">Skip to the files</a>

  <header class="appHeader">
    <div class="appHeader__inner">
      <div class="appHeader__left">
        <a id="backLink" class="backLink" href="/" hidden><i class="ic ic-chevron-left" aria-hidden="true"></i>Back to panel</a>
        <div class="appBrand">
          <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1.5" width="16" height="2.6" rx="1.3"/><path d="M2.6 5.6h12.8l-1.36 9.66a1.6 1.6 0 0 1-1.58 1.38H5.54a1.6 1.6 0 0 1-1.58-1.38z"/></svg>
          <span class="appBrand__text">
            <span class="appBrand__name">S3 Browser</span>
            <span id="versionBadge" class="versionBadge" title="Version">--</span>
          </span>
        </div>
      </div>
      <button id="permButton" type="button" class="button button--icon permButton" aria-label="Permissions of this bucket" title="Permissions of this bucket" hidden><i class="ic ic-shield-check" aria-hidden="true"></i></button>
      <div id="storageSwitcher" class="storageSwitcher is-loading" aria-label="Bucket">
        <div class="storageSwitcher__trigger is-static" aria-hidden="true">
          <span class="storageSwitcher__skeleton"></span>
        </div>
      </div>
      <div class="appHeader__right">
        <div class="themeSelect" data-theme-select>
          <button type="button" class="button button--icon themeSelect__button" data-theme-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme: system" title="Theme">
            <span class="themeSelect__current" aria-hidden="true"><i class="ic ic-device-desktop themeIcon themeIcon--system"></i><i class="ic ic-moon themeIcon themeIcon--dark"></i><i class="ic ic-sun themeIcon themeIcon--light"></i></span>
          </button>
          <div id="themeMenu" class="themeSelect__menu" role="listbox" aria-label="Theme" hidden>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="system" aria-selected="true" aria-label="System theme" title="System"><i class="ic ic-device-desktop" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="dark" aria-selected="false" aria-label="Dark theme" title="Dark"><i class="ic ic-moon" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="light" aria-selected="false" aria-label="Light theme" title="Light"><i class="ic ic-sun" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1">
    <div id="notices" class="notices" aria-live="polite"></div>

    <section id="browser" class="part browser" aria-labelledby="folderTitle">
      <div class="browserHead">
        <h1 id="folderTitle" class="visually-hidden">Loading the buckets</h1>
        <nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>
        <div class="toolbar" role="toolbar" aria-label="Folder actions">
          <form id="searchForm" class="searchField" role="search">
            <i class="ic ic-search" aria-hidden="true"></i>
            <label class="visually-hidden" for="searchInput">Open a prefix in this folder</label>
            <input id="searchInput" class="input" type="search" autocomplete="off" spellcheck="false" placeholder="Open a prefix in this folder" />
            <kbd aria-hidden="true">Enter</kbd>
          </form>
          <label id="tagFilterWrap" class="searchField searchField--tags" hidden>
            <i class="ic ic-tags" aria-hidden="true"></i>
            <span class="visually-hidden">Filter the rows by tag</span>
            <input id="tagFilter" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="Filter by tag: key or key=value" />
            <span id="tagStatus" class="searchField__status" role="status" aria-live="polite"></span>
          </label>
          <span id="accessBadge" class="badge" hidden></span>
          <div id="settingsWrap" class="menuWrap menuWrap--tight">
            <button id="settingsButton" class="iconButton" type="button" aria-label="Listing settings" title="Listing settings" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu"><i class="ic ic-settings" aria-hidden="true"></i></button>
            <div id="settingsMenu" class="menu menu--settings" role="group" aria-label="Listing settings" hidden>
              <p class="menu__title">Columns</p>
              <label class="menu__check"><input type="checkbox" checked disabled data-column="name" /><span>Name</span></label>
              <label class="menu__check"><input type="checkbox" data-column="tags" /><span>Tags</span></label>
              <label class="menu__check" id="versionsSetting"><input type="checkbox" data-column="versions" /><span>Versions</span></label>
              <label class="menu__check"><input type="checkbox" data-column="size" /><span>Size</span></label>
              <label class="menu__check"><input type="checkbox" data-column="modified" /><span>Modified</span></label>
              <div class="menu__sep" role="separator"></div>
              <p class="menu__title">Filters</p>
              <label class="menu__check" id="tagFilterSetting"><input type="checkbox" id="tagFilterToggle" /><span>Filter by tag</span></label>
              <div class="menu__sep" role="separator" id="uploadTagsSeparator"></div>
              <div id="uploadTagsSetting">
                <p class="menu__title">Tags of the new uploads</p>
                <input id="uploadTagsInput" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="team=data, retention=30d" aria-label="Tags of the new uploads" />
                <p id="uploadTagsMessage" class="menu__message" role="status"></p>
              </div>
              <div class="menu__sep" role="separator"></div>
              <button id="settingsReset" class="menu__item" type="button"><i class="ic ic-rotate" aria-hidden="true"></i>Reset the columns and the filter</button>
            </div>
          </div>
          <button id="refreshButton" class="iconButton" type="button" aria-label="Refresh" title="Refresh"><i class="ic ic-refresh" aria-hidden="true"></i></button>
          <div class="menuWrap">
            <button id="actionsButton" class="button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="actionsMenu">
              <i class="ic ic-dots-vertical" aria-hidden="true"></i><span class="button__label--wide">Actions</span><i class="ic ic-chevron-down button__chevron" aria-hidden="true"></i>
            </button>
            <div id="actionsMenu" class="menu" role="menu" hidden>
              <button id="zipItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-file-zip" aria-hidden="true"></i>Download as ZIP</button>
              <button id="insightsItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-chart-bar" aria-hidden="true"></i><span>Storage insights</span></button>
              <button id="folderTagsItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-tags" aria-hidden="true"></i><span>Tag the objects of this folder</span></button>
              <button id="multipartsItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-file-x" aria-hidden="true"></i><span>Incomplete uploads</span></button>
              <button id="lifecycleItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-hourglass" aria-hidden="true"></i><span>Lifecycle rules</span></button>
            </div>
          </div>
          <div id="uploadWrap" class="menuWrap">
            <button id="uploadButton" class="button button--primary" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="uploadMenu">
              <i class="ic ic-upload" aria-hidden="true"></i>Upload<i class="ic ic-chevron-down button__chevron" aria-hidden="true"></i>
            </button>
            <div id="uploadMenu" class="menu" role="menu" hidden>
              <button id="uploadFilesItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-file-upload" aria-hidden="true"></i>Upload files</button>
              <button id="uploadFolderItem" class="menu__item" type="button" role="menuitem"><i class="ic ic-folder-up" aria-hidden="true"></i>Upload a folder</button>
              <p class="menu__hint">You can also drop files on the page.</p>
            </div>
          </div>
        </div>
      </div>
      <div id="listing"></div>
    </section>
  </main>

  <div id="dropOverlay" class="dropOverlay" role="status" aria-live="polite" hidden>
    <div class="dropOverlay__card">
      <i class="ic ic-cloud-upload" aria-hidden="true"></i>
      <strong>Drop to upload</strong>
      <span>Into <code id="dropTarget">/</code></span>
    </div>
  </div>

  <aside id="uploadDock" class="uploadDock" aria-label="Uploads" hidden></aside>

  <input id="fileInput" type="file" multiple hidden />
  <input id="dirInput" type="file" webkitdirectory multiple hidden />

  <script src="assets/js/session.js"></script>
  <script src="assets/js/common/detect.js"></script>
  <script src="assets/js/common/runtime.js"></script>
  <script src="assets/js/common/api.js"></script>
  <script src="assets/js/common/ui.js"></script>
  <script src="assets/js/common/download-manager.js"></script>
  <script src="assets/js/common/actions.js"></script>
  <script src="assets/js/common/menu.js"></script>
  <script src="assets/js/tags.js"></script>
  <script src="assets/js/metadata.js"></script>
  <script src="assets/js/diff.js"></script>
  <script src="assets/js/versions.js"></script>
  <script src="assets/js/uploads.js"></script>
  <script src="assets/js/multiparts.js"></script>
  <script src="assets/js/lifecycle.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
