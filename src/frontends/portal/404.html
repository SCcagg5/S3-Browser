<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <meta name="bb-frontend" content="portal" />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Page not found - Object storage</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body>
  <header class="appHeader">
    <div class="appHeader__inner">
      <div class="appHeader__left">
        <div class="appBrand">
          <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1.5" width="16" height="2.6" rx="1.3"/><path d="M2.6 5.6h12.8l-1.36 9.66a1.6 1.6 0 0 1-1.58 1.38H5.54a1.6 1.6 0 0 1-1.58-1.38z"/></svg>
          <span class="appBrand__text"><span class="appBrand__name">S3 Browser</span></span>
        </div>
      </div>
      <div class="appHeader__right">
        <div class="themeSelect" data-theme-select>
          <button type="button" class="button button--icon themeSelect__button" data-theme-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme: system" title="Theme">
            <span class="themeSelect__current" aria-hidden="true"><i class="ic ic-device-desktop themeIcon themeIcon--system"></i><i class="ic ic-moon themeIcon themeIcon--dark"></i><i class="ic ic-sun themeIcon themeIcon--light"></i></span>
          </button>
          <div id="themeMenu" class="themeSelect__menu" role="listbox" aria-label="Theme" hidden>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="system" aria-selected="true" aria-label="System theme" title="System"><i class="ic ic-device-desktop" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="dark" aria-selected="false" aria-label="Dark theme" title="Dark"><i class="ic ic-moon" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="light" aria-selected="false" aria-label="Light theme" title="Light"><i class="ic ic-sun" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="page">
    <section class="part">
      <div class="empty">
        <i class="ic ic-file-unknown" aria-hidden="true"></i>
        <strong>Page not found</strong>
        <span>This address does not match a bucket or an object that you can open.</span>
        <a class="button" href="./">Back to the buckets</a>
      </div>
    </section>
  </main>
</body>
</html>
