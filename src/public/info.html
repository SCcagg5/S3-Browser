<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="bb-frontend" content="stowr" />
  <meta name="bb-asset-version" content="{{ASSET_VERSION}}" />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Information - Stowr</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/stowr.css" />
  <link rel="stylesheet" href="assets/css/info.css" />
</head>
<body class="infoPage">
  <a class="skipLink" href="#main">Skip to the information</a>

  <header class="appHeader">
    <div class="appHeader__inner">
      <div class="appHeader__left">
        <div class="appBrand">
          <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1.5" width="16" height="2.6" rx="1.3"/><path fill-rule="evenodd" d="M4 5.6h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM6.2 8.5h5.6a.7.7 0 0 1 0 1.4H6.2a.7.7 0 0 1 0-1.4zM6.2 12h5.6a.7.7 0 0 1 0 1.4H6.2a.7.7 0 0 1 0-1.4z"/></svg>
          <span class="appBrand__text">
            <span class="appBrand__name">Stowr</span>
            <span id="versionBadge" class="versionBadge" title="Version">--</span>
          </span>
        </div>
        <a id="infoBack" class="backLink infoBack" href="./" hidden>Browse</a>
      </div>
      <div id="storageSwitcher" class="storageSwitcher is-loading" aria-label="Bucket">
        <div class="storageSwitcher__trigger is-static" aria-hidden="true">
          <span class="storageSwitcher__skeleton"></span>
        </div>
      </div>
      <div class="appHeader__right">
        <div class="themeSelect" data-theme-select>
          <button type="button" class="button button--icon themeSelect__button" data-theme-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme: system" title="Theme">
            <span class="themeSelect__current" aria-hidden="true"><i class="ic ic-device-desktop themeIcon themeIcon--system"></i><i class="ic ic-moon themeIcon themeIcon--dark"></i><i class="ic ic-sun themeIcon themeIcon--light"></i></span>
          </button>
          <div id="themeMenu" class="themeSelect__menu" role="listbox" aria-label="Theme" hidden>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="system" aria-selected="true" aria-label="System theme" title="System"><i class="ic ic-device-desktop" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="dark" aria-selected="false" aria-label="Dark theme" title="Dark"><i class="ic ic-moon" aria-hidden="true"></i></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="light" aria-selected="false" aria-label="Light theme" title="Light"><i class="ic ic-sun" aria-hidden="true"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="pageScroll" data-page-scroll>
    <main id="main" class="infoMain" tabindex="-1">
      <div id="notices" class="notices" aria-live="polite"></div>
      <h1 id="infoTitle" class="visually-hidden">Information of the bucket</h1>
      <div id="infoFailure" class="infoFailure" role="alert" hidden><strong id="infoFailureTitle"></strong><span id="infoFailureText"></span></div>
      <div id="infoBanner" class="usageBanner" role="alert" hidden></div>
      <div id="infoSections" class="infoSections" aria-busy="true"></div>
      <div id="infoLifecycle" class="infoSections"></div>
    </main>
  </div>

  <script src="assets/js/session.js"></script>
  <script src="assets/js/common/detect.js"></script>
  <script src="assets/js/common/runtime.js"></script>
  <script src="assets/js/common/api.js"></script>
  <script src="assets/js/usage.js"></script>
  <script src="assets/js/encryption.js"></script>
  <script src="assets/js/objectlock.js"></script>
  <script src="assets/js/tags.js"></script>
  <script src="assets/js/lifecycle.js"></script>
  <script src="assets/js/states.js"></script>
  <script src="assets/js/switcher.js"></script>
  <script src="assets/js/info.js"></script>
</body>
</html>
