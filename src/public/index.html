<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="bb-asset-version" content="{{ASSET_VERSION}}" />
  <meta name="description" content="Browse, preview and manage objects in S3-compatible and Google Cloud Storage buckets." />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <title>Object Storage Browser</title>

  <!-- Keep the first visible header frame stable on hard reloads. -->
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/source-commit.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/database-outline.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/eye-outline.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/pencil-outline.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/delete-outline.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/magnify.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/refresh.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/cogs.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/plus.svg" fetchpriority="high" data-bb-initial-icon />
  <link rel="preload" as="image" type="image/svg+xml" crossorigin="anonymous" href="assets/icons/mdi/chevron-down.svg" fetchpriority="high" data-bb-initial-icon />

  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/ui.css" />
  <link rel="stylesheet" href="assets/css/treemap.css" />
  <link rel="stylesheet" href="assets/css/browser.css" />
  <link rel="stylesheet" href="assets/css/a11y.css" />
</head>
<body>
  <div id="root"></div>
  <noscript><p class="not-found">The object browser needs JavaScript to run.</p></noscript>

  <!-- The browser page ships Vue's runtime-only build: its template is compiled ahead of time into app.render.js
       (see tools/build-template.mjs), so nothing is compiled or evaluated in the browser. -->
  <script defer src="assets/vendor/vue/3.5.18/vue.runtime.global.prod.js"></script>

  <script defer src="assets/js/common/detect.js"></script>
  <script defer src="assets/js/common/runtime.js"></script>
  <script defer src="assets/js/common/api.js"></script>
  <script defer src="assets/js/common/ui.js"></script>
  <script defer src="assets/js/common/download-manager.js"></script>
  <script defer src="assets/js/common/actions.js"></script>
  <script defer src="assets/js/common/menu.js"></script>
  <script defer src="assets/js/app.render.js"></script>
  <script defer src="assets/js/app.js"></script>
</body>
</html>
