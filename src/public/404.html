<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <meta name="bb-frontend" content="portal" />
  <base href="{{APP_BASE}}" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Page not found - Stowr</title>
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/icons.css" />
  <link rel="stylesheet" href="assets/css/portal.css" />
</head>
<body>
  <header class="appHeader">
    <div class="appHeader__inner">
      <div class="appHeader__left">
        <div class="appBrand">
          <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1.5" width="16" height="2.6" rx="1.3"/><path fill-rule="evenodd" d="M4 5.6h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM6.2 8.5h5.6a.7.7 0 0 1 0 1.4H6.2a.7.7 0 0 1 0-1.4zM6.2 12h5.6a.7.7 0 0 1 0 1.4H6.2a.7.7 0 0 1 0-1.4z"/></svg>
          <span class="appBrand__text"><span class="appBrand__name">Stowr</span></span>
        </div>
      </div>
      <div class="appHeader__right">
        <div class="themeSelect" data-theme-select>
          <button type="button" class="button button--icon themeSelect__button" data-theme-trigger aria-haspopup="listbox" aria-expanded="false" aria-controls="themeMenu" aria-label="Theme: system" title="Theme">
            <span class="themeSelect__current" aria-hidden="true"><svg class="themeIcon themeIcon--system" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></svg><svg class="themeIcon themeIcon--dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg><svg class="themeIcon themeIcon--light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/></svg></span>
          </button>
          <div id="themeMenu" class="themeSelect__menu" role="listbox" aria-label="Theme" hidden>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="system" aria-selected="true" aria-label="System theme" title="System"><svg class="themeIcon themeIcon--system" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></svg></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="dark" aria-selected="false" aria-label="Dark theme" title="Dark"><svg class="themeIcon themeIcon--dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg></button>
            <button type="button" class="themeSelect__option" role="option" data-theme-value="light" aria-selected="false" aria-label="Light theme" title="Light"><svg class="themeIcon themeIcon--light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="pageScroll" data-page-scroll>
    <main class="page">
      <section class="part">
        <div class="empty">
          <i class="ic ic-file-unknown" aria-hidden="true"></i>
          <strong>Page not found</strong>
          <span>This address does not match a bucket or an object that you can open.</span>
          <a class="button" href="./">Back to the buckets</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
