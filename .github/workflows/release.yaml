name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.10"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare manual tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          case "$tag" in
            v*) ;;
            *) echo "tag must start with v, for example v1.0.10" >&2; exit 1 ;;
          esac

          git fetch --force --tags

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git checkout -f "$tag"
          else
            git tag "$tag"
          fi

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          commit=$(git rev-parse HEAD)
          build_date=$(git show -s --format=%cI HEAD)
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_DATE=$build_date" >> "$GITHUB_ENV"


      - name: Download Go modules
        working-directory: src
        run: go mod download

      - name: Test and vet
        working-directory: src
        run: |
          set -euo pipefail
          test -z "$(gofmt -l *.go)"
          go test -race ./...
          go vet ./...

      - name: Frontend contracts
        working-directory: .
        run: |
          set -euo pipefail
          for file in src/public/assets/js/*.js src/public/assets/js/common/*.js test/*.js; do
            node --check "$file"
          done
          node test/frontend-smoke.js
          node test/advanced-object-tools.js
          node test/ui-normalization.js
          node test/json-coloring.js
          node test/json-viewer.js
          node test/transfer-controls.js
          node test/stats-viewer.js
          node test/sqlite-viewer.js
          node test/office-metadata.js
          node test/subpath-support.js

      - name: Verify self-contained and private runtime
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd src && go list -m all | wc -l | tr -d ' ')" = "1"
          if grep -R --include='*.go' '"os/exec"' src; then
            echo "runtime source must not invoke external commands" >&2
            exit 1
          fi
          if grep -R --include='*.go' -E 'os\.(Getenv|LookupEnv)|ProxyFromEnvironment' src; then
            echo "runtime configuration and provider clients must not use process environment variables" >&2
            exit 1
          fi
          if grep -R --include='*.go' --exclude='*_test.go' -E 'os\.(Create|Mkdir|MkdirAll|WriteFile|OpenFile|Remove|RemoveAll|Rename)|CreateTemp|MkdirTemp' src; then
            echo "runtime source must not write application state to the local filesystem" >&2
            exit 1
          fi
          if find . -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) | grep -q .; then
            echo "font binaries must not be shipped" >&2
            exit 1
          fi
          if grep -R -E --exclude-dir=vendor --include='*.html' --include='*.js' --include='*.css' 'https?://|//cdn\.' src/public; then
            echo "runtime frontend must not contact external asset domains" >&2
            exit 1
          fi

      - name: Verify statically linked release binary
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -tags=netgo,osusergo \
              -trimpath \
              -ldflags="-s -w -buildid= -X main.buildVersion=${RELEASE_VERSION} -X main.buildCommit=${RELEASE_COMMIT} -X main.buildDate=${RELEASE_BUILD_DATE}" \
              -o /tmp/s3-browser-static .

          file /tmp/s3-browser-static
          if readelf -l /tmp/s3-browser-static | grep -q 'Requesting program interpreter'; then
            echo "release binary unexpectedly requires a dynamic loader" >&2
            exit 1
          fi
          go version -m /tmp/s3-browser-static | grep -F 'CGO_ENABLED=0'
          short_sha=$(printf '%s' "$RELEASE_COMMIT" | cut -c1-9)
          /tmp/s3-browser-static version | grep -F "${RELEASE_VERSION} · $short_sha"

      - name: Build and run the scratch image
        shell: bash
        run: |
          BUILD_VERSION="$RELEASE_VERSION" \
          BUILD_COMMIT="$RELEASE_COMMIT" \
          BUILD_DATE="$RELEASE_BUILD_DATE" \
            ./test/scratch-runtime.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.17.0"
          args: release --clean
          workdir: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
