name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: JavaScript syntax
        run: |
          for file in public/assets/js/*.js public/assets/js/common/*.js; do
            node --check "$file"
          done

      - name: Frontend smoke tests
        working-directory: .
        run: |
          node test/frontend-smoke.js
          node test/ui-normalization.js
          node test/json-coloring.js
          node test/json-viewer.js
          node test/transfer-controls.js
          node test/stats-viewer.js
          node test/sqlite-viewer.js
          node test/office-metadata.js
          node test/subpath-support.js

      - name: Shell syntax
        working-directory: .
        run: |
          for file in test/*.sh test/garage/scripts/*.sh; do
            [ -e "$file" ] || continue
            sh -n "$file"
          done

      - name: Verify self-contained and private runtime
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd src && go list -m all | wc -l | tr -d ' ')" = "1"
          if grep -R --include='*.go' '"os/exec"' src; then
            echo "runtime source must not invoke external commands" >&2
            exit 1
          fi
          if grep -R --include='*.go' -E 'os\.(Getenv|LookupEnv)|ProxyFromEnvironment' src; then
            echo "runtime configuration and provider clients must not use process environment variables" >&2
            exit 1
          fi
          if find . -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.eot' \) | grep -q .; then
            echo "font binaries must not be shipped" >&2
            exit 1
          fi
          if grep -R -E --exclude-dir=vendor --include='*.html' --include='*.js' --include='*.css' 'https?://|//cdn\.' src/public; then
            echo "runtime frontend must not contact external asset domains" >&2
            exit 1
          fi

      - name: Build static binary
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build \
              -tags=netgo,osusergo \
              -trimpath \
              -ldflags="-s -w -buildid= -X main.buildVersion=ci -X main.buildCommit=${GITHUB_SHA}" \
              -o /tmp/s3-browser-static .
          file /tmp/s3-browser-static
          if readelf -l /tmp/s3-browser-static | grep -q 'Requesting program interpreter'; then
            echo "binary unexpectedly requires a dynamic loader" >&2
            exit 1
          fi
          go version -m /tmp/s3-browser-static | grep -F 'CGO_ENABLED=0'
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-9)
          /tmp/s3-browser-static version | grep -F "ci · $short_sha"

      - name: Build and run scratch image
        working-directory: .
        env:
          BUILD_VERSION: ci
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: ./test/scratch-runtime.sh
