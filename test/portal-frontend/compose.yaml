# The test stack of the "portal" interface: one Garage and one S3-Browser with server.frontend = "portal".
# run.sh starts it under its own project name. No port is published: the Playwright container joins the network.
services:
  garage:
    build:
      context: ../garage
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro

  browser:
    build:
      context: ../..
      dockerfile: test/browser/Dockerfile
      target: runtime
    command: ["-c", "/config/config.hcl"]
    read_only: true
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro
    depends_on:
      garage:
        condition: service_healthy
