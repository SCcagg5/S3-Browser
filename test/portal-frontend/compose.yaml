# The test stack of the "portal" interface: three S3 providers (SeaweedFS, MinIO and Garage) and one Stowr with
# server.frontend = "portal". Each provider reads its identity from config.hcl and test/secrets, and creates its
# buckets at start. Stowr also shows the Docker volume volume-data as the volume "files". run.sh starts it under
# its own project name. No port is published: the Playwright container joins the network.
services:
  seaweedfs:
    build:
      context: ../seaweedfs
    # The data of each provider is on a tmpfs of a known size: the capacity of the storage behind each bucket is then
    # the same on each test host, and far from full.
    tmpfs:
      - /data:size=4g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro

  minio:
    build:
      context: ../minio
    tmpfs:
      - /data:size=4g
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro

  garage:
    build:
      context: ../garage
    tmpfs:
      - /var/lib/garage:size=4g
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro

  # The Docker volume of the volume "files" starts empty and belongs to root. This one-shot service gives it to the user
  # of Stowr (65532) before Stowr starts: the start checks that the process can write in the folder.
  volume-init:
    image: alpine:3.21
    command: ["sh", "-c", "chown 65532:65532 /data/volume && chmod 0755 /data/volume"]
    volumes:
      - volume-data:/data/volume

  browser:
    build:
      context: ../..
      dockerfile: test/browser/Dockerfile
      target: runtime
      # A copy from 8 KiB up goes in parts of 5 MiB (the S3 minimum), so the tests copy in parts with small objects.
      args:
        MULTIPART_COPY_THRESHOLD: "8192"
        MULTIPART_COPY_PART_SIZE: "5242880"
    command: ["-c", "/config/config.hcl"]
    read_only: true
    volumes:
      - ./config.hcl:/config/config.hcl:ro
      - ../secrets:/config/secrets:ro
      # The folder of the volume "files" (config.hcl). The root file system of the container stays read only.
      - volume-data:/data/volume
    depends_on:
      volume-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      minio:
        condition: service_healthy
      garage:
        condition: service_healthy

volumes:
  # A tmpfs of a known size: the file system of the volume "files" is the same on each test host.
  volume-data:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g
