services:
  s3-browser:
    build:
      context: ..
      dockerfile: test/browser/Dockerfile
      target: runtime
    container_name: s3-browser
    restart: unless-stopped
    command: ["-c", "/config/config.hcl"]
    read_only: true
    volumes:
      - ./config.hcl:/config/config.hcl:ro
    ports:
      - "8080:8080"
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/s3-browser", "healthcheck", "-c", "/config/config.hcl"]
      interval: 10s
      timeout: 3s
      retries: 10

  garage:
    build:
      context: ./garage
      dockerfile: Dockerfile
    container_name: garage
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./config.hcl:/config/config.hcl:ro
